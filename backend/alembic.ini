# Alembic configuration placeholder
# Run: alembic init alembic (if not present)
# Then configure sqlalchemy.url in alembic.ini to match DATABASE_URL

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./nexora.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S